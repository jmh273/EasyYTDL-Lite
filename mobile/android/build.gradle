// 版本組合沿用 EasyToggle 已驗證的 AGP 8.13.0 + Gradle 8.14.3 + Kotlin 2.2.20(2026-11-03)。
// AGP 8.x 仍提供 app/build.gradle(kit 範本)用到的 applicationVariants API。
// 🔴 Compose BOM、compileSdk、AGP 支援上限三者連動,要一起升(見 mobile/KIT-DIFF.md)。
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20' apply false
}

// [KIT-DIFF] kit 範本的 app/build.gradle 讀 rootProject.ext.*(原本來自 Capacitor 的 variables.gradle)。
ext {
    minSdkVersion = 29      // Android 10:MediaStore 以 RELATIVE_PATH 寫入 Music/ 不需要儲存權限
    compileSdkVersion = 36  // AGP 8.13 支援上限
    targetSdkVersion = 35   // 測試機 XQ-DQ72(Android 15)
}
